<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Hill Hotel - Food Menu</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <div id="nav-img">
      <img
        src="/images/573042711_1257512113060075_5532132655197880755_n.jpg"
        alt="Logo"
      />
    </div>

    <section class="testimonial container">
      <h2 class="testimonial__title">Food Menu</h2>
      <div class="testimonial__swiper swiper">
        <div class="swiper-wrapper" id="menu-wrapper"></div>
        <div class="swiper-pagination"></div>
      </div>
    </section>

    <div class="floating-cart-btn" onclick="openCartModal()">
      <span>🛒 Сагс</span>
      <span id="cartCountBadge" class="cart-count-badge">0</span>
    </div>

    <div id="orderModal" class="custom-modal">
      <div class="modal-content modal-content--cart">
        <span class="close-btn" onclick="closeOrderModal()">&times;</span>
        <h2 class="modal-title">Миний Сагс</h2>

        <div class="modal-body">
          <div id="cartItemsList" class="cart-items-list"></div>

          <div class="cart-total-area">
            <span>Нийт дүн:</span>
            <span id="cartTotalAmount" class="cart-total-amount">0₮</span>
          </div>

          <form id="orderForm" onsubmit="submitOrder(event)">
            <div class="form-group">
              <label for="clientTable">Ширээний дугаар:</label>
              <input
                type="number"
                id="clientTable"
                required
                placeholder="Жишээ нь: 5"
                min="1"
              />
            </div>
            <div class="form-group">
              <label for="clientName">Таны нэр:</label>
              <input
                type="text"
                id="clientName"
                required
                placeholder="Нэрээ оруулна уу"
              />
            </div>
            <div class="form-group">
              <label for="clientPhone">Утасны дугаар:</label>
              <input
                type="tel"
                id="clientPhone"
                required
                placeholder="Утасны дугаар"
              />
            </div>
            <button type="submit" class="submit-order-btn">
              Захиалга баталгаажуулах
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="app.js"></script>

    <script>
      // Хуудас ачаалагдахад сагсны тэмдэгтийг шинэчлэх
      window.onload = function () {
        updateCartBadge();
        loadMenu("food");
      };

      // Модалын гадна талын хар дэвсгэр дээр дарахад хаах
      window.onclick = function (event) {
        const modal = document.getElementById("orderModal");
        if (event.target == modal) {
          closeOrderModal();
        }
      };
    </script>
  </body>
</html>
